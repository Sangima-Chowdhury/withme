{% extends "base.html" %}

{% block content %}
    
<div class="container">
    <h1>Post a Need</h1>
    <p>Tell the community what you need help with, and someone might just lend a hand! Be honest and clear.</p>

    <form action="/post/new" method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. Need food for 3 days"
                required
            >
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select a category</option>
                <option value="Food">🍚 Food</option>
                <option value="Medical">🏥 Medical</option>
                <option value="Shelter">🏠 Shelter</option>
                <option value="Education">📚 Education</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Your Story</label>
            <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Explain your situation honestly..."
                required
            ></textarea>
        </div>

        <div class="form-group">
            <label for="photo">Add a Photo (optional)</label>
            <input type="file" id="photo" name="photo" accept="image/*">
            </div>
            
            <button type="submit">Post My Need</button>

    </form>
</div>

{% endblock %}
